name: Build Drive Copier Pro 1.0.0 Portable

on:
  push:
    paths:
      - 'release-source/portable100/READY'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_ZIP: release-source/portable100/portable100_source.zip
  SOURCE_SHA256: 9aff5490a4661d320370e3e50be89bbd4e38cef33eef4da4f30849f1b16d5bd2
  PORTABLE_NAME: DriveCopier-Pro-1.0.0-Portable-win-x64.zip

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract source archive
        shell: pwsh
        run: |
          if (!(Test-Path $env:SOURCE_ZIP)) { throw "Missing $env:SOURCE_ZIP" }
          $hash=(Get-FileHash $env:SOURCE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SOURCE_SHA256=$hash"
          if ($hash -ne $env:SOURCE_SHA256) { throw "Source archive SHA256 mismatch: $hash" }
          Expand-Archive $env:SOURCE_ZIP source -Force
          $sln = Get-ChildItem source -Recurse -Filter DriveCopier.sln | Select-Object -First 1
          if (!$sln) { throw 'DriveCopier.sln not found after extraction' }
          $root = $sln.Directory.FullName
          Write-Host "SOURCE_ROOT=$root"
          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inject publisher Google OAuth identity
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) { throw 'Missing GOOGLE_OAUTH_CLIENT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_SECRET)) { throw 'Missing GOOGLE_OAUTH_CLIENT_SECRET' }
          $target = Join-Path $env:SOURCE_ROOT 'src/DriveCopier.GoogleDrive/Authentication/PublisherOAuthClient.Generated.cs'
          if (!(Test-Path (Split-Path $target))) { throw "OAuth source folder missing: $(Split-Path $target)" }
          $id = $env:CLIENT_ID.Replace('\\','\\\\').Replace('"','\\"')
          $secret = $env:CLIENT_SECRET.Replace('\\','\\\\').Replace('"','\\"')
          @"
          namespace DriveCopier.GoogleDrive.Authentication;
          internal static class PublisherOAuthClient
          {
              public const string ClientId = "$id";
              public const string ClientSecret = "$secret";
              public static bool IsConfigured => !string.IsNullOrWhiteSpace(ClientId) && ClientId.Contains(".apps.googleusercontent.com", StringComparison.OrdinalIgnoreCase);
          }
          "@ | Set-Content $target -Encoding utf8

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app self-contained win-x64
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          dotnet publish src/DriveCopier.App/DriveCopier.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Drive Copier app publish failed' }

      - name: Publish updater self-contained
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          dotnet publish src/DriveCopier.Updater/DriveCopier.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater publish failed' }
          Copy-Item publish/updater/DriveCopier.Updater.exe publish/win-x64/DriveCopier.Updater.exe -Force

      - name: Finalize portable layout
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          $dir = Join-Path $env:SOURCE_ROOT 'publish/win-x64'
          $exe = Get-ChildItem $dir -File -Filter '*.exe' | Where-Object { $_.Name -ne 'DriveCopier.Updater.exe' } | Select-Object -First 1
          if (!$exe) { throw 'Main application EXE not found after publish' }
          if ($exe.Name -ne 'DriveCopierPro.exe') {
            Copy-Item $exe.FullName (Join-Path $dir 'DriveCopierPro.exe') -Force
            Remove-Item $exe.FullName -Force
          }
          New-Item -ItemType Directory -Force (Join-Path $dir 'data'),(Join-Path $dir 'logs'),(Join-Path $dir 'reports') | Out-Null
          @'
          DRIVE COPIER PRO 1.0.0 PORTABLE

          1. Extract the entire ZIP to a writable folder.
          2. Double-click DriveCopierPro.exe.
          3. No .NET installation is required; this package is self-contained for Windows x64.
          4. Keep DriveCopier.Updater.exe in the same folder for in-app updates.
          '@ | Set-Content (Join-Path $dir 'README_PORTABLE.txt') -Encoding utf8
          if (!(Test-Path (Join-Path $dir 'DriveCopierPro.exe'))) { throw 'DriveCopierPro.exe missing' }
          if (!(Test-Path (Join-Path $dir 'DriveCopier.Updater.exe'))) { throw 'DriveCopier.Updater.exe missing' }

      - name: Package and verify portable ZIP
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          $out = Join-Path $env:SOURCE_ROOT $env:PORTABLE_NAME
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $out -Force
          $check = Join-Path $env:RUNNER_TEMP 'portable-check'
          Expand-Archive $out $check -Force
          if (!(Test-Path (Join-Path $check 'DriveCopierPro.exe'))) { throw 'ZIP verification failed: DriveCopierPro.exe missing' }
          if (!(Test-Path (Join-Path $check 'DriveCopier.Updater.exe'))) { throw 'ZIP verification failed: updater missing' }
          $hash=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $out).Length
          Write-Host "PORTABLE_SHA256=$hash"
          Write-Host "PORTABLE_SIZE=$size"
          "PORTABLE_PATH=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveCopier-Pro-1.0.0-Portable-win-x64
          path: ${{ env.PORTABLE_PATH }}
          if-no-files-found: error
          retention-days: 90
