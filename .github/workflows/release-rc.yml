name: Build and publish Drive Copier RC

on:
  push:
    paths:
      - 'release-source/**/READY'

permissions:
  contents: write

env:
  VERSION: 1.0.0-rc6.6
  TAG: v1.0.0-rc6.6
  ASSET: DriveCopier-Pro-1.0.0-rc6.6-win-x64.zip
  SOURCE_DIR: release-source/rc6.6

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare source archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:SOURCE_DIR 'source.zip'
          if (!(Test-Path $archive)) { throw 'RC6.6 source.zip is missing' }
          Copy-Item $archive source.zip -Force
          Expand-Archive source.zip srcpkg -Force
          $root = Get-ChildItem srcpkg -Directory | Select-Object -First 1
          if (!$root) { throw 'Source root missing' }
          "SOURCE_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inject publisher Google OAuth identity
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) { throw 'Missing GOOGLE_OAUTH_CLIENT_ID repository secret' }
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_SECRET)) { throw 'Missing GOOGLE_OAUTH_CLIENT_SECRET repository secret' }
          $target = Join-Path $env:SOURCE_ROOT 'src/DriveCopier.GoogleDrive/Authentication/PublisherOAuthClient.Generated.cs'
          $id = $env:CLIENT_ID.Replace('\\','\\\\').Replace('"','\\"')
          $secret = $env:CLIENT_SECRET.Replace('\\','\\\\').Replace('"','\\"')
          @"
          namespace DriveCopier.GoogleDrive.Authentication;
          internal static class PublisherOAuthClient
          {
              public const string ClientId = "$id";
              public const string ClientSecret = "$secret";
              public static bool IsConfigured => !string.IsNullOrWhiteSpace(ClientId) && ClientId.Contains(".apps.googleusercontent.com", StringComparison.OrdinalIgnoreCase);
          }
          "@ | Set-Content $target -Encoding utf8

      - name: Prepare CI-only source adjustments
        shell: pwsh
        run: |
          $proj = Join-Path $env:SOURCE_ROOT 'src/DriveCopier.App/DriveCopier.App.csproj'
          $xml = Get-Content $proj -Raw
          $xml = $xml -replace '\s*<None Include="Assets\\DriveCopierIconSource\.png"\s*/>', ''
          Set-Content $proj $xml -Encoding utf8

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          dotnet restore DriveCopier.sln
          dotnet build DriveCopier.sln -c Release --no-restore

      - name: Publish app and updater
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          dotnet publish src/DriveCopier.App/DriveCopier.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/win-x64
          dotnet publish src/DriveCopier.Updater/DriveCopier.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/updater
          Copy-Item publish/updater/DriveCopier.Updater.exe publish/win-x64/DriveCopier.Updater.exe -Force

      - name: Package and hash
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $env:ASSET -Force
          $hash=(Get-FileHash $env:ASSET -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $env:ASSET).Length
          "ASSET_PATH=$((Resolve-Path $env:ASSET).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET_SHA=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:TAG --yes --cleanup-tag 2>$null
          gh release create $env:TAG $env:ASSET_PATH --repo $env:GITHUB_REPOSITORY --title "Drive Copier Pro $env:VERSION" --notes "RC6.6: Google download quota-aware copy handling and updater stability fixes." --prerelease

      - name: Update updater manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force updates | Out-Null
          $obj = [ordered]@{
            channel='rc'; version=$env:VERSION; tag=$env:TAG;
            published_at=(Get-Date).ToUniversalTime().ToString('o');
            download_url="https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$env:ASSET";
            sha256=$env:ASSET_SHA; size=[int64]$env:ASSET_SIZE;
            release_notes='RC6.6: Google download quota-aware copy handling and updater stability fixes.'
          }
          $obj | ConvertTo-Json | Set-Content updates/rc.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/rc.json
          git commit -m "Update RC manifest to $env:VERSION"
          git push
